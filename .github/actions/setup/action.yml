name: Setup Node + pnpm
description: Instala Node, pnpm e dependências do monorepo com cache
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        run_install: false
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
